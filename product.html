  <style>

<body>

  <button class="back-top" onclick="scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑</button>
  <div class="toast" id="toast" role="status"></div>
  <script id="zorra-detail-js">(function(){'use strict';function read(k,f){try{var v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function param(n){return new URLSearchParams(location.search).get(n)||''}function money(v){return'Rs. '+Number(v||0).toLocaleString('en-IN')}function icon(c){c=String(c||'').toLowerCase();if(/food|grocery|fruit|vegetable/.test(c))return'🛍️';if(/fashion|cloth/.test(c))return'👕';if(/elect/.test(c))return'🎧';if(/beauty|care/.test(c))return'✨';if(/home|furniture/.test(c))return'🏠';return'📦'}function products(){var a=read('ls_catalog_products',[]),p=read('ls_last_product',null);if(p&&!a.some(function(x){return x.id===p.id}))a.unshift(p);return a}function shops(){var a=read('ls_catalog_shops',[]),s=read('ls_last_shop',null);if(s&&!a.some(function(x){return x.id===s.id}))a.unshift(s);return a}function cart(){return read('ls_cart',{shopId:null,shopName:'',items:[]})}function toast(m){var e=document.getElementById('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(window.__zt);window.__zt=setTimeout(function(){e.classList.remove('show')},2200)}function badge(){var n=(cart().items||[]).reduce(function(t,i){return t+Number(i.qty||0)},0);document.querySelectorAll('[data-cart-count]').forEach(function(e){e.textContent=n})}function add(p,s,q){var c=cart();q=Math.max(1,Number(q)||1);if(Number(p.stock)===0)return toast('This product is out of stock.');if(c.shopId&&c.shopId!==s.id){if(!confirm('Your cart contains products from another shop. Clear it and continue?'))return;c={shopId:null,shopName:'',items:[]}}c.shopId=s.id;c.shopName=s.name||'Shop';var i=(c.items||[]).find(function(x){return x.productId===p.id}),max=Math.max(1,Number(p.stock)||99);if(i)i.qty=Math.min(max,Number(i.qty||0)+q);else c.items.push({productId:p.id,name:p.name,price:Number(p.price)||0,qty:Math.min(max,q),image:p.image||'',category:p.category||'',stock:max});write('ls_cart',c);badge();toast((p.name||'Product')+' added to cart')}function wish(p,s,b){var a=read('ls_wishlist',[]),i=a.findIndex(function(w){return w.id===p.id});if(i>=0){a.splice(i,1);b&&b.classList.remove('active');toast('Removed from wishlist')}else{a.push({id:p.id,name:p.name,price:p.price,image:p.image||'',category:p.category||'',shopId:s.id,shopName:s.name||'Shop',addedAt:new Date().toISOString()});b&&b.classList.add('active');toast('Saved to wishlist')}write('ls_wishlist',a)}function card(p,s){return'<article class="card" data-product="'+esc(p.id)+'" tabindex="0"><div class="card-img">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':icon(p.category))+'</div><h3>'+esc(p.name||'Product')+'</h3><p class="meta">'+esc((s&&s.name)||p.category||'Local product')+'</p><div class="card-foot"><span class="card-price">'+money(p.price)+'</span><button class="mini-add">Add</button></div></article>'}function bind(root,ps,ss){root.querySelectorAll('[data-product]').forEach(function(e){var id=e.dataset.product,p=ps.find(function(x){return x.id===id}),s=p&&ss.find(function(x){return x.id===p.shopId});if(!p||!s)return;e.onclick=function(ev){if(ev.target.closest('.mini-add'))return add(p,s,1);write('ls_last_product',p);write('ls_last_shop',s);location.href='product.html?id='+encodeURIComponent(id)};e.onkeydown=function(ev){if(ev.key==='Enter')e.click()}})}function nav(){badge();document.querySelectorAll('[data-home]').forEach(function(e){e.onclick=function(){location.href='home.html'}});document.querySelectorAll('[data-cart]').forEach(function(e){e.onclick=function(){location.href='home.html?action=cart'}});var s=document.querySelector('[data-search]');if(s)s.onkeydown=function(e){if(e.key==='Enter'&&s.value.trim())location.href='home.html?search='+encodeURIComponent(s.value.trim())}}window.ZD={read:read,write:write,esc:esc,param:param,money:money,icon:icon,products:products,shops:shops,toast:toast,add:add,wish:wish,card:card,bind:bind,nav:nav}})();
</script>
  <script>
  (function(){
    var z=ZD,products=z.products(),shops=z.shops(),product=products.find(function(item){return item.id===z.param('id');})||z.read('ls_last_product',null)||products[0];
    var shop=product&&(shops.find(function(item){return item.id===product.shopId;})||z.read('ls_last_shop',null));
    z.nav();
    var root=document.getElementById('root');
    if(!product||!shop){root.innerHTML='<div class="empty"><h2>Product not available</h2><p>Return home to explore current products.</p><a class="btn primary" href="home.html">Explore ZORRA</a></div>';return;}
    document.title=(product.name||'Product')+' | ZORRA';
    document.getElementById('crumb-product').textContent=product.name||'Product';
    var shopCrumb=document.getElementById('crumb-shop');shopCrumb.textContent=shop.name||'Shop';shopCrumb.href='shop.html?id='+encodeURIComponent(shop.id);
    var oldPrice=Number(product.oldPrice||product.mrp||product.originalPrice)||0,currentPrice=Number(product.price)||0,discount=oldPrice>currentPrice?Math.round((oldPrice-currentPrice)/oldPrice*100):0;
    var isWishlisted=z.read('ls_wishlist',[]).some(function(item){return item.id===product.id;});
    var visual=product.image?'<img src="'+z.esc(product.image)+'" alt="'+z.esc(product.name)+'">':'<span class="fallback">'+z.icon(product.category)+'</span>';
    root.innerHTML='<section class="gallery surface"><div class="media">'+(discount?'<span class="discount">'+discount+'% OFF</span>':'')+visual+'</div></section><section class="detail surface"><span class="eyebrow">'+z.esc(product.category||'Local favourite')+'</span><h1>'+z.esc(product.name||'Product')+'</h1><div class="rating"><span class="stars">★★★★★</span><b>'+Number(product.rating||shop.rating||4.7).toFixed(1)+'</b><span>Verified local seller</span></div><div class="price-row"><span class="price">'+z.money(currentPrice)+'</span>'+(oldPrice?'<span class="old">'+z.money(oldPrice)+'</span>':'')+(discount?'<span class="save">Save '+discount+'%</span>':'')+'</div><p class="description">'+z.esc(product.description||'Freshly listed by a nearby ZORRA seller. Add it to your cart and order locally with confidence.')+'</p><div class="trust-row"><div class="trust">⚡ Fast local delivery</div><div class="trust">✓ Quality checked</div><div class="trust">↻ Easy support</div></div><div class="purchase"><div class="qty"><button id="minus" aria-label="Decrease quantity">−</button><span id="qty">1</span><button id="plus" aria-label="Increase quantity">+</button></div></div><div class="product-actions"><button class="add" id="add">Add to Cart</button><button class="order-now" id="order-now">Order Now</button><button class="wish '+(isWishlisted?'active':'')+'" id="wish" aria-label="Save to wishlist">♥</button></div><div class="seller" id="seller"><span class="seller-logo">'+z.esc((shop.name||'Z').charAt(0))+'</span><span class="seller-copy"><b>'+z.esc(shop.name||'Local shop')+'</b><span>'+z.esc(shop.category||'Nearby seller')+' · '+Number(shop.rating||4.7).toFixed(1)+' rating</span></span><b>View shop →</b></div></section>';
    var quantity=1,maximumStock=Math.max(1,Number(product.stock)||99);
    document.getElementById('minus').onclick=function(){quantity=Math.max(1,quantity-1);document.getElementById('qty').textContent=quantity;};
    document.getElementById('plus').onclick=function(){quantity=Math.min(maximumStock,quantity+1);document.getElementById('qty').textContent=quantity;};
    document.getElementById('add').onclick=function(){z.add(product,shop,quantity);};
    document.getElementById('order-now').onclick=function(){z.add(product,shop,quantity);var currentCart=z.read('ls_cart',{items:[]});var added=(currentCart.items||[]).some(function(item){return item.productId===product.id;});if(added){this.disabled=true;this.textContent='Opening checkout...';setTimeout(function(){location.href='home.html?action=checkout';},220);}};
    document.getElementById('wish').onclick=function(){z.wish(product,shop,this);};
    document.getElementById('seller').onclick=function(){z.write('ls_last_shop',shop);location.href='shop.html?id='+encodeURIComponent(shop.id);};
    var related=products.filter(function(item){return item.shopId===shop.id&&item.id!==product.id&&item.active!==false;}).slice(0,10),grid=document.getElementById('related');
    grid.innerHTML=related.map(function(item){return z.card(item,shop);}).join('')||'<div class="empty">More products from this shop will appear here soon.</div>';z.bind(grid,products,shops);
  })();
  </script>
